[package]
name = "bspwm-cyberquote"
version = "0.1.0"
edition = "2021"
description = "Cyberpunk motivational quote overlay for BSPWM — background WebView with glitch, scanlines, CRT, typewriter animation."

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"], optional = true }
webkit6 = { version = "0.6", optional = true }
gdk4-x11 = { version = "0.11", features = ["xlib"], optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
rand = "0.8"
libc = "0.2"
glib = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["link-gtk"]
link-gtk = ["gtk", "webkit6", "gdk4-x11", "glib"]

[profile.release]
opt-level = 3
lto = true
